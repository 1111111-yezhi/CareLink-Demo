<div class="hidden absolute inset-0 z-30 text-white flex-col items-center justify-center gap-5 px-8" id="callOverlay" style="background:rgba(20,32,46,.96)">
<div class="w-24 h-24 rounded-full bg-[#E4611A] flex items-center justify-center text-[30px] font-extrabold" id="callAvatar">通</div>
<p class="text-[26px] font-extrabold" id="callName">儿子 李小明</p>
<p class="text-[18px] text-white/80" id="callState">正在呼叫…</p>
<p class="text-[14px] text-white/60" id="hangHint">叫通了就会自动接起来</p>
<button class="min-h-[60px] px-10 rounded-full bg-[#D92D20] text-white text-[19px] font-extrabold flex items-center gap-2" id="hangBtn">
<iconify-icon class="text-[24px]" icon="mdi:phone-hangup"></iconify-icon>挂断
    </button>
</div>
</div>
<script>
  var overlay = document.getElementById('callOverlay');
  var callName = document.getElementById('callName');
  var callState = document.getElementById('callState');
  var hangHint = document.getElementById('hangHint');
  var hangBtn = document.getElementById('hangBtn');
  var callTimer = null;

  function startCall(name, kind) {
    callName.textContent = name;
    callState.textContent = kind === '留言' ? '正在录音…请说话' : '正在呼叫…';
    hangHint.textContent = kind === '留言' ? '说完点下面结束' : '叫通了就会自动接起来';
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    window.clearTimeout(callTimer);
    if (kind === '留言') {
      hangHint.textContent = '正在录音 0:03';
      return;
    }
    callTimer = window.setTimeout(function () {
      callState.textContent = '通话中 00:12';
      hangHint.textContent = '话说完了就点下面挂断';
    }, 2200);
  }

  function endCall() {
    window.clearTimeout(callTimer);
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    callState.textContent = '正在呼叫…';
    hangHint.textContent = '叫通了就会自动接起来';
  }

  var callButtons = document.querySelectorAll('.callbtn');
  for (var i = 0; i < callButtons.length; i++) {
    callButtons[i].addEventListener('click', function () {
      startCall(this.getAttribute('data-name'), this.getAttribute('data-kind'));
    });
  }

  hangBtn.addEventListener('click', endCall);
</script>
